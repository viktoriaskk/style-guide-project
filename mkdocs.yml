site_name: Консультации · Руководство по стилю
site_description: Правила пользовательской документации учебного сервиса записи на консультации
site_url: https://viktoriaskk.github.io/style-guide-project/
repo_url: https://github.com/viktoriaskk/style-guide-project
edit_uri: blob/main/docs/
use_directory_urls: true
theme:
  name: mkdocs
  locale: ru
  color_mode: light
  user_color_mode_toggle: true
plugins:
  - search:
      lang: [ru, en]
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
extra_css:
  - assets/extra.css
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Начало: index.md
  - Объект и аудитория: product.md
  - Руководство:
      - Применение правил: guide/principles.md
      - Язык и тон: guide/language.md
      - Терминология: guide/terminology.md
      - Структура документов: guide/structure.md
      - Оформление и Markdown: guide/formatting.md
      - Даты и сообщения: guide/interface.md
      - Шаблоны: guide/document-templates.md
      - Доступность текста: guide/accessibility.md
      - Проверка и обновление: guide/quality.md
  - Примеры:
      - Запись студента: examples/student-booking.md
      - Расписание преподавателя: examples/teacher-schedule.md
  - Проверка стайлгайда: validation.md
  - Теория и источники: research.md
